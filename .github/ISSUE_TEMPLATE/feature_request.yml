name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation rather than a solution — it helps to find the simplest fit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like TimeTrack to do?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This doesn't need data to leave the device, or I've explained why it must (and how it could be opt-in).
