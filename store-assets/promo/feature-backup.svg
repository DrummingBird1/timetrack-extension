<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bkAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="bkGlow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="300" rx="24" fill="#15151f"/>
  <rect width="360" height="300" rx="24" fill="url(#bkGlow)"/>

  <!-- cloud -->
  <g transform="translate(180,128)">
    <path d="M-70,20 a30,30 0 0 1 8,-59 a40,40 0 0 1 76,-10 a34,34 0 0 1 -6,69 Z"
      fill="url(#bkAccent)"/>
  </g>

  <!-- lock badge overlapping cloud -->
  <g transform="translate(180,150)">
    <circle r="30" fill="#15151f" stroke="#0c0c14" stroke-width="4"/>
    <rect x="-15" y="-4" width="30" height="24" rx="6" fill="#ececf4"/>
    <path d="M-9,-4 V-13 a9,9 0 0 1 18,0 V-4" fill="none" stroke="#ececf4" stroke-width="5"/>
    <circle cx="0" cy="8" r="4" fill="#15151f"/>
  </g>

  <!-- sync arrows -->
  <g transform="translate(94,205)" stroke="#65657c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0,0 a16,16 0 1 1 4,10"/>
    <path d="M0,-6 L0,0 L6,0"/>
  </g>
  <g transform="translate(266,205) scale(-1,1)" stroke="#65657c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0,0 a16,16 0 1 1 4,10"/>
    <path d="M0,-6 L0,0 L6,0"/>
  </g>

  <rect x="70" y="238" width="220" height="14" rx="7" fill="#232331"/>
  <rect x="112" y="264" width="136" height="10" rx="5" fill="#65657c"/>
</svg>
