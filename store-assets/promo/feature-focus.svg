<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="focusAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="focusGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="300" rx="24" fill="#15151f"/>
  <rect width="360" height="300" rx="24" fill="url(#focusGlow)"/>

  <!-- timer ring -->
  <g transform="translate(180,132)">
    <circle r="70" fill="none" stroke="#232331" stroke-width="14"/>
    <circle r="70" fill="none" stroke="url(#focusAccent)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="330 440" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#ececf4">25:00</text>
  </g>

  <!-- blocked-tab badge -->
  <g transform="translate(258,64)">
    <circle r="26" fill="#15151f" stroke="#2a2a3a" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#ef4444" stroke-width="4"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect x="60" y="238" width="240" height="14" rx="7" fill="#232331"/>
  <rect x="120" y="264" width="120" height="10" rx="5" fill="#65657c"/>
</svg>
