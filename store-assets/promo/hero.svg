<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="heroGlowA" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowB" cx="0.05" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="560" rx="28" fill="#0c0c14"/>
  <rect width="800" height="560" rx="28" fill="url(#heroGlowA)"/>
  <rect width="800" height="560" rx="28" fill="url(#heroGlowB)"/>

  <!-- browser window card -->
  <rect x="80" y="70" width="640" height="420" rx="18" fill="#15151f" stroke="#2a2a3a" stroke-width="1.5"/>
  <!-- window titlebar -->
  <rect x="80" y="70" width="640" height="46" rx="18" fill="#1c1c28"/>
  <rect x="80" y="98" width="640" height="18" fill="#1c1c28"/>
  <circle cx="112" cy="93" r="6" fill="#ef4444"/>
  <circle cx="134" cy="93" r="6" fill="#f59e0b"/>
  <circle cx="156" cy="93" r="6" fill="#22c55e"/>
  <rect x="330" y="84" width="180" height="18" rx="9" fill="#232331"/>

  <!-- brand mark -->
  <rect x="112" y="140" width="52" height="52" rx="15" fill="url(#heroAccent)"/>
  <circle cx="138" cy="166" r="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="66 22" transform="rotate(45 138 166)"/>
  <rect x="176" y="146" width="150" height="16" rx="6" fill="#ececf4"/>
  <rect x="176" y="168" width="100" height="12" rx="5" fill="#65657c"/>

  <!-- summary cards row -->
  <g>
    <rect x="112" y="210" width="130" height="70" rx="13" fill="#1c1c28" stroke="#2a2a3a"/>
    <rect x="128" y="226" width="60" height="14" rx="5" fill="#ececf4"/>
    <rect x="128" y="248" width="90" height="10" rx="4" fill="#65657c"/>
    <rect x="254" y="210" width="130" height="70" rx="13" fill="#1c1c28" stroke="#2a2a3a"/>
    <rect x="270" y="226" width="60" height="14" rx="5" fill="#ececf4"/>
    <rect x="270" y="248" width="90" height="10" rx="4" fill="#65657c"/>
    <rect x="396" y="210" width="130" height="70" rx="13" fill="#1c1c28" stroke="#2a2a3a"/>
    <rect x="412" y="226" width="60" height="14" rx="5" fill="#22c55e"/>
    <rect x="412" y="248" width="90" height="10" rx="4" fill="#65657c"/>
  </g>

  <!-- bar chart -->
  <g>
    <rect x="112" y="300" width="290" height="150" rx="13" fill="#1c1c28" stroke="#2a2a3a"/>
    <rect x="132" y="390" width="20" height="40" rx="5" fill="url(#heroAccent)"/>
    <rect x="164" y="360" width="20" height="70" rx="5" fill="url(#heroAccent)"/>
    <rect x="196" y="405" width="20" height="25" rx="5" fill="#2a2a3a"/>
    <rect x="228" y="345" width="20" height="85" rx="5" fill="url(#heroAccent)"/>
    <rect x="260" y="375" width="20" height="55" rx="5" fill="url(#heroAccent)"/>
    <rect x="292" y="400" width="20" height="30" rx="5" fill="#2a2a3a"/>
    <rect x="324" y="355" width="20" height="75" rx="5" fill="url(#heroAccent)"/>
  </g>

  <!-- donut chart -->
  <g transform="translate(490,375)">
    <circle r="62" fill="none" stroke="#2a2a3a" stroke-width="22"/>
    <circle r="62" fill="none" stroke="#34d399" stroke-width="22" stroke-dasharray="180 390" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="62" fill="none" stroke="#f472b6" stroke-width="22" stroke-dasharray="110 390" stroke-dashoffset="-180" transform="rotate(-90)"/>
    <circle r="62" fill="none" stroke="#fbbf24" stroke-width="22" stroke-dasharray="100 390" stroke-dashoffset="-290" transform="rotate(-90)"/>
  </g>
  <rect x="600" y="300" width="120" height="150" rx="13" fill="#1c1c28" stroke="#2a2a3a"/>
  <g transform="translate(600,300)">
    <circle cx="20" cy="30" r="5" fill="#34d399"/><rect x="34" y="25" width="70" height="10" rx="4" fill="#9595ad"/>
    <circle cx="20" cy="55" r="5" fill="#f472b6"/><rect x="34" y="50" width="60" height="10" rx="4" fill="#9595ad"/>
    <circle cx="20" cy="80" r="5" fill="#fbbf24"/><rect x="34" y="75" width="50" height="10" rx="4" fill="#9595ad"/>
  </g>
</svg>
